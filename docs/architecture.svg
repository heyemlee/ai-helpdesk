<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" role="img" aria-labelledby="title desc">
  <title id="title">AI Helpdesk architecture</title>
  <desc id="desc">A question from the staff console or a customer client reaches the agent service, deployed with Docker Compose as a staff and a customer instance. A router votes on the intent, tools run concurrently (knowledge search, and an order lookup delegated over A2A to a separate SQL agent that plans, writes, runs and repairs its own queries), specialist agents answer, in parallel when a question spans domains, and an answer guard with confidence gates returns a reply or opens a handoff ticket. Redis holds working memory, PostgreSQL with pgvector holds knowledge, memory, tickets and audit records, and telemetry goes to Tempo, Prometheus, Loki and Grafana.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #8e8e93; }
    .title { font-size: 16px; font-weight: 600; fill: #1d1d1f; }
    .name { font-size: 14px; font-weight: 600; fill: #1d1d1f; }
    .sub { font-size: 12.5px; fill: #6e6e73; }
    .step { font-size: 12.5px; font-weight: 600; fill: #1d1d1f; }
    .note { font-size: 11.5px; fill: #6e6e73; }
    .num { font-size: 11px; font-weight: 600; fill: #8e8e93; }
    .edge { font-size: 11px; fill: #8e8e93; }
    .card { fill: #ffffff; stroke: #e3e3e8; stroke-width: 1; }
    .wire { fill: none; stroke: #d6d6dc; stroke-width: 1.5; }
    .chip { fill: #f5f5f7; animation: lit 8s linear infinite; }
    .pulse {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 0.14 1.3;
      stroke-dashoffset: 0.14;
      opacity: 0;
      animation: travel 8s linear infinite;
    }
    .data { stroke: #0a7cff; }
    .ai { stroke: #d97757; }
    .service { stroke: #0d9488; }
    .live { animation: breathe 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes travel {
      0% { stroke-dashoffset: 0.14; opacity: 1; }
      24% { stroke-dashoffset: -1; opacity: 1; }
      25%, 100% { stroke-dashoffset: -1; opacity: 0; }
    }
    @keyframes lit {
      0%, 9% { fill: #e6f0ff; }
      13%, 100% { fill: #f5f5f7; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .chip, .live { animation: none; }
    }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="592">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="591" rx="16" fill="#ffffff" stroke="#ececf0" />

  <!-- The deployment box goes under the wires, its cards over them -->
  <rect x="300" y="28" width="360" height="540" rx="18" fill="#fafafb" stroke="#e3e3e8" />

  <!-- Wires -->
  <path class="wire" d="M240,160 L320,160" />
  <path class="wire" d="M240,292 L320,292" />
  <path class="wire" d="M392,352 L392,384" />
  <path class="wire" d="M568,352 L568,384" />
  <path class="wire" d="M480,352 L480,492" />
  <path class="wire" d="M640,158 C680,158 680,126 720,126" />
  <path class="wire" d="M640,212 L720,212" />
  <path class="wire" d="M640,264 C680,264 680,300 720,300" />
  <path class="wire" d="M640,316 C680,316 680,380 720,380" />

  <text class="edge" x="270" y="152" text-anchor="middle">/api · SSE</text>
  <text class="edge" x="270" y="284" text-anchor="middle">Nginx :80</text>
  <text class="edge" x="400" y="372">memory</text>
  <text class="edge" x="576" y="372">search</text>
  <text class="edge" x="690" y="118" text-anchor="middle">vectors</text>
  <text class="edge" x="690" y="204" text-anchor="middle">A2A</text>
  <text class="edge" x="690" y="258" text-anchor="middle">prompts</text>
  <text class="edge" x="690" y="322" text-anchor="middle">handoff</text>

  <!-- Pulses, in the order of one question that needs knowledge and order data: in from the console, memory,
       embeddings for the vote and the search, the search, the order lookup out to the SQL agent and its progress
       streaming back, the specialist agents' model calls, the reply, a handoff alert, then telemetry -->
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M240,160 L320,160" style="animation-delay: 0s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M392,352 L392,384" style="animation-delay: 0.7s" />
  <path class="pulse ai" pathLength="1" filter="url(#glow)" d="M640,158 C680,158 680,126 720,126" style="animation-delay: 1.3s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M568,352 L568,384" style="animation-delay: 2s" />
  <path class="pulse service" pathLength="1" filter="url(#glow)" d="M640,212 L720,212" style="animation-delay: 2.5s" />
  <path class="pulse service" pathLength="1" filter="url(#glow)" d="M720,212 L640,212" style="animation-delay: 3.2s" />
  <path class="pulse ai" pathLength="1" filter="url(#glow)" d="M640,264 C680,264 680,300 720,300" style="animation-delay: 4s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M320,160 L240,160" style="animation-delay: 5.2s" />
  <path class="pulse service" pathLength="1" filter="url(#glow)" d="M640,316 C680,316 680,380 720,380" style="animation-delay: 5.9s" />
  <path class="pulse service" pathLength="1" filter="url(#glow)" d="M480,352 L480,492" style="animation-delay: 6.6s" />

  <!-- Clients -->
  <g filter="url(#lift)">
    <rect class="card" x="32" y="104" width="208" height="112" rx="14" />
    <rect class="card" x="32" y="244" width="208" height="96" rx="14" />
  </g>
  <text class="eyebrow" x="52" y="130">BROWSER · STAFF</text>
  <text class="title" x="52" y="154">Support console</text>
  <text class="sub" x="52" y="178">React 18 · TanStack Query</text>
  <text class="sub" x="52" y="198">chat · knowledge · tickets</text>

  <text class="eyebrow" x="52" y="270">CUSTOMERS</text>
  <text class="title" x="52" y="294">Your site or app</text>
  <text class="sub" x="52" y="318">POST /chat · /chat/stream</text>

  <!-- The deployment -->
  <circle class="live" cx="322" cy="54" r="4.5" fill="#2496ed" />
  <text class="name" x="334" y="59">Docker Compose</text>
  <text class="edge" x="640" y="59" text-anchor="end">one deploy</text>

  <rect class="card" x="320" y="76" width="320" height="276" rx="14" filter="url(#lift)" />
  <text class="name" x="340" y="102">Agent service · FastAPI</text>
  <text class="sub" x="340" y="122">staff and customer instances, one image</text>

  <rect class="chip" x="336" y="136" width="288" height="44" rx="8" style="animation-delay: 1.3s" />
  <rect class="chip" x="336" y="188" width="288" height="48" rx="8" style="animation-delay: 2s" />
  <rect class="chip" x="336" y="244" width="288" height="44" rx="8" style="animation-delay: 4s" />
  <rect class="chip" x="336" y="296" width="288" height="44" rx="8" style="animation-delay: 5s" />
  <text class="num" x="348" y="154">1</text>
  <text class="step" x="364" y="154">Router</text>
  <text class="note" x="364" y="171">intent vote: LLM · embeddings · rules</text>
  <text class="num" x="348" y="207">2</text>
  <text class="step" x="364" y="207">Tools, run concurrently</text>
  <text class="note" x="364" y="225">knowledge search · order lookup</text>
  <text class="num" x="348" y="262">3</text>
  <text class="step" x="364" y="262">Specialist agents ×3 · fallback</text>
  <text class="note" x="364" y="279">in parallel across domains</text>
  <text class="num" x="348" y="314">4</text>
  <text class="step" x="364" y="314">Answer guard · confidence gates</text>
  <text class="note" x="364" y="331">reply, or a handoff ticket</text>

  <!-- Storage -->
  <rect class="card" x="320" y="384" width="144" height="88" rx="14" filter="url(#lift)" />
  <text class="name" x="338" y="411">Redis 7</text>
  <text class="sub" x="338" y="432">working memory</text>
  <text class="sub" x="338" y="451">shared state</text>

  <g filter="url(#lift)">
    <path d="M496,396 V460 A72,12 0 0 0 640,460 V396" fill="#ffffff" stroke="#e3e3e8" />
    <ellipse cx="568" cy="396" rx="72" ry="12" fill="#fafafb" stroke="#e3e3e8" />
  </g>
  <text class="name" x="568" y="428" text-anchor="middle">PostgreSQL 16</text>
  <text class="sub" x="568" y="446" text-anchor="middle">pgvector · tsvector</text>
  <text class="sub" x="568" y="462" text-anchor="middle" style="font-size: 11.5px">tickets · audit · memory</text>

  <rect class="card" x="320" y="492" width="320" height="60" rx="14" filter="url(#lift)" />
  <text class="name" x="340" y="516">Observability</text>
  <text class="edge" x="620" y="516" text-anchor="end">OTLP · /metrics · logs</text>
  <text class="sub" x="340" y="537">Tempo · Prometheus · Loki · Grafana</text>

  <!-- Outside the deployment -->
  <g filter="url(#lift)">
    <rect class="card" x="720" y="94" width="208" height="64" rx="14" />
    <rect class="card" x="720" y="170" width="208" height="88" rx="14" />
    <rect class="card" x="720" y="268" width="208" height="64" rx="14" />
    <rect class="card" x="720" y="348" width="208" height="64" rx="14" />
  </g>
  <circle cx="740" cy="118" r="4.5" fill="#d97757" />
  <text class="name" x="752" y="123">Embedding model</text>
  <text class="sub" x="740" y="145">any /embeddings endpoint</text>

  <circle cx="740" cy="194" r="4.5" fill="#0d9488" />
  <text class="name" x="752" y="199">SQL agent</text>
  <text class="edge" x="908" y="199" text-anchor="end">peer agent</text>
  <text class="sub" x="740" y="221">ai-sql-agent over A2A</text>
  <text class="sub" x="740" y="241" style="font-size: 12px">plan → SQL → run → repair</text>

  <circle cx="740" cy="292" r="4.5" fill="#d97757" />
  <text class="name" x="752" y="297">Chat model</text>
  <text class="sub" x="740" y="319">OpenAI or Anthropic API</text>

  <circle cx="740" cy="372" r="4.5" fill="#0d9488" />
  <text class="name" x="752" y="377">Ticket webhook</text>
  <text class="sub" x="740" y="399">outbox, retried delivery</text>
</svg>
