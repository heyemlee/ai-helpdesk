<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 560" width="844" height="560" role="img" aria-labelledby="title desc">
  <title id="title">System overview: two agent services and their contract</title>
  <desc id="desc">One repository holds two agent services and the contract between them. The staff console and, through Nginx on port 80, customers call the support agent in backend/, a FastAPI service on Python 3.12 that runs five stages: understand, gather, route, answer and check, with its state in PostgreSQL 16, Redis 7 and optionally Kafka, in a staff and a customer instance. The staff instance delegates data questions to the Text2SQL agent in ai-sql-agent/, a FastAPI service on Python 3.11: over A2A after reading its Agent Card, with message/stream as JSON-RPC 2.0 and stage events, the artifact and a final event back over SSE, or over HTTP /query, the default. The SQL agent routes, retrieves tables, plans a step per data source, writes SQL, runs it read-only through an SQLGlot gate, repairs it at most twice and checks the result against the business databases. Both agents call model APIs through their own connections. The a2a-contract directory, version 1.13, holds the protocol document, five JSON Schemas, 30 golden fixtures and a self-check, and both agents' tests read it from the same commit. One CI runs five required checks on every pull request: Backend, Frontend, A2A contract, SQL Agent and Docker images.</desc>
