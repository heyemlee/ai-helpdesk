# 故障演练和压测用的独立一套（项目名 aihd-drill）：和日常那套 docker-compose.yml 不共用
# 任何容器、数据卷和端口，在同一台机器上可以同时开着。
#
#   docker compose -f deploy/drill/docker-compose.yml build api
#   docker compose -f deploy/drill/docker-compose.yml up -d
#   backend/.venv/bin/python backend/scripts/chaos_drill.py           # 演练
#   docker run --rm --network host -v "$PWD/loadtest:/scripts" grafana/k6 run /scripts/runs.js   # 压测
#   docker compose -f deploy/drill/docker-compose.yml down -v
#
# 事件日志走 Kafka（events/kafka.py）的那一档：多起一个 broker、建 topic、投影和采样两个消费者
#   DRILL_EVENT_SINK=kafka docker compose -f deploy/drill/docker-compose.yml --profile kafka up -d --wait
#
# SQL Agent 那一侧（--profile sql-agent）：和生产一样按生产模式起、只认 API Key、只挂 sql-net、
# 不发布端口；多一个只挂 default 的客户实例，和一个把 span 打进自己日志的 OTel Collector。
# 员工那边（api、worker、api-inline）要连它，得把地址和链路的出口也告诉它们：
#   DRILL_SQL_AGENT_URL=http://sql-agent:8000 DRILL_OTEL_ENDPOINT=http://otel-collector:4318 \
#     docker compose -f deploy/drill/docker-compose.yml --profile sql-agent up -d --wait
# SQL Agent 读的语义层和四个业务库不在 git 里：目录结构和生产的 deploy/sql-agent/data 一样
# （semantic/、simple/），默认就用它，别处的用 DRILL_SQL_AGENT_DATA 指过去。生成方法见
# ai-sql-agent/tools/simple_erp/README.md。模型用的也是 mock-llm，所以查询会失败——正好用来看
# 员工实例的退回路径。
#
# 模型是假的（scripts/mock_llm.py）：不花钱，延迟、限流可配、可复现。没有观测那一整套
# （Grafana、Tempo、Loki）——演练脚本直接读 Postgres、Redis 和各进程的 /metrics。
# worker 默认三个、各跑 4 个 run；租约 10 秒（日常是 30 秒），被杀掉的 worker 手上的 run
# 大约 15 秒后被接手，演练不用等太久。

name: aihd-drill

x-backend-env: &backend-env
  APP_ENV: development
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  LLM_PROVIDER: openai
  OPENAI_API_KEY: mock
  OPENAI_BASE_URL: http://mock-llm:9000/v1
  OPENAI_MODEL: mock-1
  POSTGRES_DSN: postgresql://drill:drill@postgres:5432/drill
  REDIS_URL: redis://redis:6379/0
  AI_HELPDESK_INSTANCE: staff
  AI_HELPDESK_EVENT_LOG: full
  AI_HELPDESK_RUN_MODE: queued
  AI_HELPDESK_RUN_LEASE_S: "10"
  AI_HELPDESK_RUN_REDISPATCH_S: "15"
  AI_HELPDESK_WORKER_CONCURRENCY: "4"
  AI_HELPDESK_RUN_QUEUE_MAX: ${DRILL_QUEUE_MAX:-200}
  AI_HELPDESK_DEGRADE_BACKLOG: ${DRILL_DEGRADE_BACKLOG:-20,40,80,160}
  AI_HELPDESK_LLM_RPM: ${DRILL_LLM_RPM:-0}
  AI_HELPDESK_LLM_TPM: ${DRILL_LLM_TPM:-0}
  AI_HELPDESK_FRONTEND_DIST: /nonexistent
  # 事件日志写到哪：postgres（默认），或者 kafka（要 --profile kafka 起 broker 和消费者）
  AI_HELPDESK_EVENT_SINK: ${DRILL_EVENT_SINK:-postgres}
  AI_HELPDESK_KAFKA_BOOTSTRAP: kafka:9092
  # SQL Agent（--profile sql-agent）。地址默认留空 = 不委派，和加它之前一样
  SQL_AGENT_URL: ${DRILL_SQL_AGENT_URL:-}
  SQL_AGENT_API_KEY: drill-staff-key
  SQL_AGENT_TRANSPORT: a2a
  # 链路：默认不导出；配了 DRILL_OTEL_ENDPOINT 时 httpx 会在委派请求里带上 traceparent
  OTEL_EXPORTER_OTLP_ENDPOINT: ${DRILL_OTEL_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: drill
      POSTGRES_DB: drill
    ports:
      - "127.0.0.1:${DRILL_PG_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill -d drill"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # 持久化开着：演练里重启 Redis，派发队列和帧流都还在。不持久化的情形另有一档
    # （演练脚本 --flush-redis），验证 Redis 整个丢了 run 也不丢
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:${DRILL_REDIS_PORT:-26379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-llm:
    image: aihd-drill/backend:dev
    pull_policy: never
    command: ["python", "scripts/mock_llm.py", "--port", "9000"]
    environment:
      MOCK_LLM_LATENCY_MS: ${MOCK_LLM_LATENCY_MS:-800}
      MOCK_LLM_STRUCTURED_LATENCY_MS: ${MOCK_LLM_STRUCTURED_LATENCY_MS:-400}
      MOCK_LLM_CHUNK_MS: ${MOCK_LLM_CHUNK_MS:-60}
      MOCK_LLM_RPM: ${MOCK_LLM_RPM:-0}
      MOCK_LLM_HANDOFF_RATE: ${MOCK_LLM_HANDOFF_RATE:-0.3}
    ports:
      - "127.0.0.1:${DRILL_MOCK_PORT:-29000}:9000"
    networks: [default, sql-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: aihd-drill/backend:dev
    build:
      context: ../../backend
      target: production
      args:
        AI_HELPDESK_RELEASE: drill
    environment:
      <<: *backend-env
      AI_HELPDESK_ROLE: api
    ports:
      - "127.0.0.1:${DRILL_API_PORT:-28080}:8000"
    networks: [default, sql-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # inline 模式的 API（一轮跑在请求里，原来的样子），只用来和排队模式比首字延迟：
  #   docker compose -f deploy/drill/docker-compose.yml --profile compare up -d api-inline
  #   backend/.venv/bin/python loadtest/ttfe_probe.py
  # 生产两个实例跑的就是 inline，--profile sql-agent 也起它，用来核对委派
  api-inline:
    image: aihd-drill/backend:dev
    pull_policy: never
    profiles: ["compare", "sql-agent"]
    environment:
      <<: *backend-env
      AI_HELPDESK_RUN_MODE: inline
    ports:
      - "127.0.0.1:${DRILL_INLINE_PORT:-28081}:8000"
    networks: [default, sql-net]
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: aihd-drill/backend:dev
    pull_policy: never
    environment:
      <<: *backend-env
      AI_HELPDESK_ROLE: worker
      AI_HELPDESK_RUN_DRAIN_S: "45"
    networks: [default, sql-net]
    deploy:
      replicas: ${DRILL_WORKERS:-3}
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── 事件日志的 Kafka 那一侧（--profile kafka）────────────────────────────────
  # 单节点 KRaft（broker 和 controller 一个进程，不要 ZooKeeper）。容器里的服务连 kafka:9092，
  # 本机的演练脚本连 127.0.0.1:29092。不自动建 topic：topic 的分区数和保留期由 kafka-topics 定，
  # 写错名字的生产者拿到的是错误，不是一个保留期不对的新 topic。不挂数据卷：docker restart
  # 保留容器里的文件，演练重启 broker 时 topic 和消费组的 offset 都在；down 之后才清掉
  kafka:
    image: apache/kafka:4.3.1
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${DRILL_KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${DRILL_KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # 建 topic（6 个分区、留 7 天）和死信 topic，跑完就退出；已经有了只改保留期
  kafka-topics:
    image: aihd-drill/backend:dev
    pull_policy: never
    profiles: ["kafka"]
    command: ["python", "-m", "app.events", "topics", "--instance", "staff"]
    environment:
      <<: *backend-env
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # 投影：topic → turn_events。指标（消费积压）在 :9102
  projector:
    image: aihd-drill/backend:dev
    pull_policy: never
    profiles: ["kafka"]
    command: ["python", "-m", "app.events", "project", "--instance", "staff"]
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:${DRILL_PROJECTOR_METRICS_PORT:-29102}:9102"
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9102/metrics >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 采样：topic → eval_candidates
  sampler:
    image: aihd-drill/backend:dev
    pull_policy: never
    profiles: ["kafka"]
    command: ["python", "-m", "app.events", "sample", "--instance", "staff"]
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:${DRILL_SAMPLER_METRICS_PORT:-29103}:9102"
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9102/metrics >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── SQL Agent 那一侧（--profile sql-agent）──────────────────────────────────────
  # 和 docker-compose.yml 的 sql-agent 同一套设置，只是模型换成 mock-llm、Key 是这里的固定值
  sql-agent:
    image: aihd-drill/sql-agent:dev
    build:
      context: ../../ai-sql-agent
      dockerfile: deploy/Dockerfile
      args:
        AI_SQL_RELEASE: drill
    profiles: ["sql-agent"]
    environment:
      AI_SQL_APP_ENV: production
      AI_SQL_DEPLOYMENT_SCOPE: internal_single_tenant
      AI_SQL_AUTH_MODE: api_key
      AI_SQL_API_KEYS_FILE: /run/secrets/sql_agent_keys.json
      AI_SQL_UNKNOWN_ROLE_POLICY: deny
      AI_SQL_SEMANTIC_DIR: /app/semantic
      AI_SQL_PGVECTOR_DSN: ""
      AI_SQL_AUDIT_DB_PATH: /app/state/audit.db
      AI_SQL_RUNS_DB_PATH: /app/state/runs.db
      AI_SQL_MEMORY_DB_PATH: /app/state/memory.db
      AI_SQL_MODEL_SETTINGS_PATH: /app/state/model_settings.json
      AI_SQL_LOG_FORMAT: json
      AI_SQL_MODEL_PROVIDER: openai
      AI_SQL_OPENAI_API_KEY: mock
      AI_SQL_OPENAI_BASE_URL: http://mock-llm:9000/v1
      AI_SQL_CHAT_MODEL: mock-1
      AI_SQL_CODER_MODEL: mock-1
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DRILL_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: ai-sql-agent
    secrets:
      - source: sql_agent_keys
        target: sql_agent_keys.json
    volumes:
      - sql-agent-state:/app/state
      - ${DRILL_SQL_AGENT_DATA:-../sql-agent/data}/semantic:/app/semantic:ro
      - ${DRILL_SQL_AGENT_DATA:-../sql-agent/data}/simple:/app/runtime_data/simple:ro
    networks: [sql-net]
    depends_on:
      mock-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 客户实例：和生产一样只挂 default、不委派、手里没有 Key。演练里从它里面连 sql-agent，应当连不上
  api-customer:
    image: aihd-drill/backend:dev
    pull_policy: never
    profiles: ["sql-agent"]
    environment:
      <<: *backend-env
      AI_HELPDESK_INSTANCE: customer
      AI_HELPDESK_RUN_MODE: inline
      SQL_AGENT_URL: ""
      SQL_AGENT_API_KEY: ""
      ENABLE_CROSS_SESSION_MEMORY: "false"
      AI_HELPDESK_TOOL_LOOP: "off"
      OTEL_SERVICE_NAME: ai-helpdesk-customer
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 收 span，原样打进自己的日志（debug 导出器）：docker compose logs otel-collector 里对一条链路
  # 是不是从员工实例一直连到 SQL Agent 的各个阶段
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    profiles: ["sql-agent"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
    networks: [default, sql-net]

networks:
  default:
  # 和生产一样：sql-agent 只挂这里，员工那边两个都挂，客户实例、postgres 不挂
  sql-net:

volumes:
  sql-agent-state:

secrets:
  # 演练用的固定 Key（结构同 deploy/sql-agent/sql_agent_keys.example.json），员工那一把在上面的 backend-env
  sql_agent_keys:
    file: ./sql_agent_keys.json
