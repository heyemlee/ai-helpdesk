# 排队模式的 worker（docker-compose.queued.yml 挂进 /etc/prometheus/scrape.d/）。
# 一轮对话在 worker 上跑：模型调用、工具、首句延迟（mode=queued）这些指标都在这里，不在 API 上
scrape_configs:
  - job_name: 'ai-helpdesk-worker'
    static_configs:
      - targets: ['ai-helpdesk-worker:8000']
        labels:
          service: 'ai-helpdesk-worker'
    scrape_interval: 10s
  - job_name: 'ai-helpdesk-customer-worker'
    static_configs:
      - targets: ['ai-helpdesk-customer-worker:8000']
        labels:
          service: 'ai-helpdesk-customer-worker'
    scrape_interval: 10s
