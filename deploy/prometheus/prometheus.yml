# Prometheus 配置文件 — ai-helpdesk 智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ai-helpdesk'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # ai-helpdesk 主应用指标
  - job_name: 'ai-helpdesk-app'
    static_configs:
      - targets: ['ai-helpdesk:8000']
        labels:
          service: 'ai-helpdesk'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
