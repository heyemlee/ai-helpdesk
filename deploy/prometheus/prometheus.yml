# Prometheus 配置文件 — ai-helpdesk 智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ai-helpdesk'
    environment: 'production'

# 别的抓取配置从这里叠进来：排队模式（docker-compose.queued.yml）把 worker 那一份挂进这个目录。
# inline 模式下这里是空的，不会多出一排抓不到的目标
scrape_config_files:
  - "/etc/prometheus/scrape.d/*.yml"

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # ai-helpdesk 主应用指标
  - job_name: 'ai-helpdesk-app'
    static_configs:
      - targets: ['ai-helpdesk:8000']
        labels:
          service: 'ai-helpdesk'
    scrape_interval: 10s

  # 面向客户的实例（不接 ai-sql-agent），和员工实例分开看
  - job_name: 'ai-helpdesk-customer'
    static_configs:
      - targets: ['ai-helpdesk-customer:8000']
        labels:
          service: 'ai-helpdesk-customer'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
