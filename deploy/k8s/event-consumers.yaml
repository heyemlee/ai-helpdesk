# 事件日志在 Kafka 那一侧：建 topic 的 Job，每个实例一个投影消费者（写 turn_events）、一个采样
# 消费者（写 eval_candidates）。和 api、worker 是同一个镜像、同一份配置（各自实例的原文保留期也
# 一样，客户实例 14 天），入口是 `python -m app.events`（backend/app/events/__main__.py）。
#
# 投影由 KEDA 按消费组的积压扩缩（keda.yaml），上限是分区数：比分区多的消费者分不到分区，只会
# 闲着。采样有状态（按轮次攒事件），固定一个副本；换分区时先提交、再交出去，接手的从提交点重建。

# 建 topic（6 个分区、留 7 天）和死信 topic；已经有的只改保留期。跑完 5 分钟后自己删掉，
# 下一次 kubectl apply 会再跑一遍——它本来就是幂等的
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-helpdesk
        app.kubernetes.io/component: kafka-topics
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: aihd/backend
          command: ["python", "scripts/wait_for.py", "kafka:9092", "--timeout", "300"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      containers:
        - name: topics
          image: aihd/backend
          command: ["python", "-m", "app.events", "topics", "--instance", "staff", "--instance", "customer"]
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projector-staff
spec:
  # 副本数归 KEDA 管（keda.yaml），这里只是初始值
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: projector-staff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-helpdesk
        app.kubernetes.io/component: projector-staff
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-deps
          image: aihd/backend
          command: ["python", "scripts/wait_for.py", "kafka:9092", "postgres:5432", "--timeout", "300"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      containers:
        - name: projector
          image: aihd/backend
          command: ["python", "-m", "app.events", "project", "--instance", "staff"]
          envFrom:
            - configMapRef: {name: backend-config}
            - configMapRef: {name: staff-config}
            - secretRef: {name: backend-secrets}
          ports:
            - containerPort: 9102
              name: metrics
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
---
