# 单节点 Kafka（KRaft：broker 和 controller 一个进程，不要 ZooKeeper）：事件日志的 topic
# （AI_HELPDESK_EVENT_SINK=kafka，backend/app/events/kafka.py）。只有事件日志走它；派发和帧流在 Redis。
#
# 两个监听：集群里的服务连 kafka:9092；本机的演练脚本经 port-forward 连 127.0.0.1:29092
# （scripts/k8s-drill.sh）——Kafka 把自己报给客户端的地址必须是客户端连得上的那一个，所以各报各的。
# 集群里那一个报的是带命名空间的全名：KEDA 在 keda 命名空间里看积压，短名 kafka 在那边解析不了
# （第一次部署时 KEDA 的 kafka 触发器就是这么报错的）。
# 不自动建 topic：分区数和保留期由 kafka-topics 那个 Job 定（event-consumers.yaml）。
#
# 生产形态是三个节点、副本数 3、min.insync.replicas=2（或者托管的 Kafka）；这里一个节点，
# 够验证投影、采样、重放和按积压扩缩。
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: ai-helpdesk
    app.kubernetes.io/component: kafka
spec:
  selector:
    app.kubernetes.io/component: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
    - name: host
      port: 29092
      targetPort: 29092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-helpdesk
        app.kubernetes.io/component: kafka
    spec:
      # 镜像里跑的是 appuser（uid 1000）：数据卷要归它，不然 broker 写不进去
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka.$(POD_NAMESPACE).svc.cluster.local:9092,HOST://127.0.0.1:29092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m"}
          ports:
            - {containerPort: 9092, name: internal}
            - {containerPort: 29092, name: host}
          readinessProbe:
            tcpSocket: {port: internal}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: internal}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 200m, memory: 640Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
