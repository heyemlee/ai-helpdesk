global:
  scrape_interval: 15s
rule_files: ["/etc/prometheus/alerts/*.yml"]
scrape_configs:
  - job_name: ai-helpdesk-app
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000", "worker:8000"]
  - job_name: ai-sql-agent
    static_configs:
      - targets: ["sql-agent:8000"]
