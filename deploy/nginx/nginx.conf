# Nginx 反向代理配置
# 用于 ai-helpdesk 智能客服系统的生产部署

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # 上游服务器配置
    # 80 端口是对外入口，给客户用，所以转发到面向客户的实例 ai-helpdesk-customer：
    # 它不接 ai-sql-agent，客户查不到订单数据。员工实例 ai-helpdesk 不从这里暴露。
    upstream aihelpdesk_backend {
        least_conn;
        server ai-helpdesk-customer:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # HTTP 服务器配置
    server {
        listen 80;
        # 容器内 localhost 会先解析到 ::1，健康检查依赖这行
        listen [::]:80;
        server_name localhost;

        # 重定向到 HTTPS (生产环境)
        # return 301 https://$server_name$request_uri;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # 对外入口只放行客户用得到的三个接口：/chat、/chat/stream、/health。
        # 其余端点（工单、对话、知识库、评测、监控、技能、令牌签发、API 文档、指标）
        # 一律 404。员工直连 8080，或者用控制台 5174。
        #
        # 原来是"代理所有路径"，再单独挡掉 /metrics：那条按来源放行
        # 127.0.0.1 和 172.28.0.0/16 的规则在 Docker Desktop 上不成立——经发布端口
        # 进来的外部请求，来源地址会被改写成网桥网关，也在 172.28 网段里。
        # Prometheus 在 Docker 内网直接抓应用，不经过这里。
        location = /chat {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://aihelpdesk_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 一次回答里有多次模型调用，60 秒不够稳妥
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # 流式聊天（SSE）：必须关掉缓冲，否则 nginx 攒满缓冲区才往下发，
        # 客户看不到逐句输出。
        location = /chat/stream {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://aihelpdesk_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # 排队模式（AI_HELPDESK_RUN_MODE=queued）下断线续流：只读、只认 32 位十六进制的
        # run_id。run_id 本身就是凭据（80 位随机数），客户端拿它和 Last-Event-ID 接着读；
        # inline 模式下后端对这两个路径回 404。提交仍然只走 /chat/stream，不放行 POST /runs。
        # 正则里有花括号，必须整个加引号，否则 nginx 把 {32} 当成块的开头，整份配置起不来
        location ~ "^/runs/[0-9a-f]{32}(/events)?$" {
            limit_except GET { deny all; }
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://aihelpdesk_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # 健康检查端点
        location = /health {
            proxy_pass http://aihelpdesk_backend/health;
            access_log off;
        }

        location / {
            return 404;
        }

    }

    # HTTPS 服务器配置 (生产环境)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # SSL 证书配置
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # SSL 会话缓存
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS (可选)
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # 其他配置与 HTTP 相同
    #     # ...
    # }
}
