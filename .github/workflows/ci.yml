name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 手动触发。加它有两个理由：
  # 一是 2026-08-21 之后 push 事件不再触发本工作流（aa98d87 是最后一次运行，
  # 其后落到 main 的提交 check runs 全是 0），需要一条不依赖 push 的路子来判断
  # 是"触发失效"还是"Actions 整个不跑"；二是往后想在某个提交上补跑一次时，
  # 不必靠推一个空提交去骗触发。
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # pgvector 容器：让 PgStore/PgTicketStore/PgConversationLog 的
      # 合同测试在 CI 里真实跑（本地未配置 TEST_POSTGRES_DSN 时自动跳过）
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test
        # 测试不发真实网络请求，这里给一个占位 key 满足启动期配置校验
        env:
          ANTHROPIC_API_KEY: test-key
          TEST_POSTGRES_DSN: postgresql://test:test@localhost:5432/test
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 于 2026-04 EOL。这里和 frontend/Dockerfile 必须是同一个大版本，
          # 否则 CI 构建通过、镜像构建挂掉（或者反过来，更糟）。
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 干净依赖安装：**不要**退回 `npm install`。原先写的是 `npm ci || npm install`，
      # lock 与 package.json 对不上时它会静默改用 install，于是 CI 验的依赖树和
      # 镜像里的不是同一套，"构建通过"这件事就不再有意义。
      - name: Install dependencies (clean)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # 生产构建必须过。2026-09-04 的审查里它是挂的（useChatStream.ts 少一个
      # 类型导入，TS2552），而 48 个前端单测照样全绿——**单测挡不住构建**，
      # 这一步是那条缺口唯一的门禁。
      - name: Build (production)
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只构建不推送：验证两个 Dockerfile 始终可构建
      - name: Build frontend image
        run: docker build -t ai-helpdesk-frontend:ci frontend

      - name: Build backend image
        run: docker build -t ai-helpdesk:ci --target production backend
