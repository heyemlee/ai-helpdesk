# 只跑前端（后端在宿主机上单独跑）时用这个文件。
# 想一条命令起全栈，用 ../docker-compose.yml。
services:
  ai-helpdesk-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-helpdesk-frontend
    ports:
      - "5174:80"
    environment:
      - API_UPSTREAM=host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
