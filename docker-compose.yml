# ai-helpdesk 智能客服系统 — Docker Compose 服务编排
#
# 存储：Redis（工作记忆/限流/熔断共享）+ Postgres+pgvector（工单/审计/
#       KB 向量/情景记忆/用户画像，存储收敛后的唯一持久化数据库）
# 观测：Prometheus（指标）+ OTel Collector → Tempo（trace）+
#       Promtail → Loki（日志）+ Grafana（统一面板，含 trace 跳转）

services:

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-helpdesk-redis
    ports:
      # 只绑本机：应用走 Docker 内网 redis:6379，这个映射只给本机工具用
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-aihelpdesk123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aihelpdesk123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Postgres + pgvector（存储收敛：工单/审计/KB 向量/记忆/画像）──────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-helpdesk-postgres
    ports:
      # 宿主机侧用 5433：5432 被另一个 compose 项目（askdata_agent 的 pgvector）占用。
      # app 走内网 postgres:5432，不受这里影响；这个映射只给本机 psql/GUI 用，所以只绑 127.0.0.1。
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aihelpdesk}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aihelpdesk123}
      - POSTGRES_DB=${POSTGRES_DB:-aihelpdesk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihelpdesk} -d ${POSTGRES_DB:-aihelpdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-helpdesk-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── ai-helpdesk 主应用 ─────────────────────────────────────────────────────────
  ai-helpdesk:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai-helpdesk-app
    ports:
      # 宿主机 8080 → 容器 8000。容器内固定 8000（Dockerfile 的 CMD 写死），
      # 换宿主机端口只改冒号左边。8000 让给同机的 ai-sql-agent。
      #
      # 只绑本机：这个实例没有 API key（控制台不发 X-API-Key），绑到所有网卡时
      # 同一网络里的任何设备都能读工单、发起订单查询。要从别的电脑用，先在前面
      # 加一层登录（例如 Cloudflare Tunnel + Access），不要把 127.0.0.1 去掉。
      - "127.0.0.1:${AI_HELPDESK_PORT:-8080}:8000"
    env_file:
      - ./backend/.env
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aihelpdesk123}@redis:6379/0
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-aihelpdesk}:${POSTGRES_PASSWORD:-aihelpdesk123}@postgres:5432/${POSTGRES_DB:-aihelpdesk}
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - AI_HELPDESK_SKILLS_DIR=/app/skills
      # 观测：JSON 日志给 Promtail/Loki，trace 发 OTel Collector
      - LOG_FORMAT=json
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # 员工实例：订单类问题委派给同机的 ai-sql-agent。backend/.env 里的
      # SQL_AGENT_URL 是给本机直跑用的（127.0.0.1:8000），在容器里会指回容器自己，
      # 所以这里固定成宿主机地址。
      - SQL_AGENT_URL=${AI_HELPDESK_SQL_AGENT_URL:-http://host.docker.internal:8000}
      # 控制台"管理与诊断 → 模型连接"保存的配置（backend/app/core/model_settings.py）。
      # 文件里有明文 Key，权限 0600；目录不进版本库（.gitignore 的 backend/data/*）。
      - AI_HELPDESK_MODEL_SETTINGS_PATH=/app/data/runtime/model_settings.json
    volumes:
      - ./backend/data/eval:/app/data/eval
      - ./backend/skills:/app/skills
      - ./backend/logs:/app/logs
      # 两个实例挂同一个目录：员工实例在控制台保存，客户实例几秒内跟上
      - ./backend/data/runtime:/app/data/runtime
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── 面向客户的实例（不接 ai-sql-agent）──────────────────────────────────────
  # 和员工实例同一个镜像、同一套 Redis / Postgres，区别有两处。
  #
  # 一是 SQL_AGENT_URL 留空：未配置时委派整块不注册（backend/app/api/main.py
  # 注册 order_data_query 的地方），订单类问题只走知识库，客户查不到任何订单数据。
  #
  # 委派闸门本身只看意图和实体，不分员工和客户（sql_agent_client.py 的
  # should_query_business_data），所以"客户拿不到订单数据"只靠这一层：
  # 客户流量必须进这个实例，不能进员工实例。
  #
  # 二是 ENABLE_CROSS_SESSION_MEMORY=false：两个实例共用记忆库，而情景记忆和
  # 用户画像只按 user_id 区分，这个实例的 user_id 又取自请求体。开着的话，客户
  # 填一个员工的 user_id（控制台默认是 u1001）就能把员工对话的摘要和画像带进
  # 自己的上下文，等于绕过上面那一层；不填 user_id 的客户还会共用 anonymous
  # 这一份记忆。关掉后这两级不读也不写，同一段对话内的记忆不受影响。
  #
  # backend/.env.customer 给这个实例单独配 AI_HELPDESK_API_KEY：工单、对话、
  # 知识库、评测等端点必须带 X-API-Key，/chat 仍然开放。没有这把钥匙时，
  # 客户能列出全部工单、读任意对话。模板见 backend/.env.customer.example。
  ai-helpdesk-customer:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai-helpdesk-customer
    ports:
      # 只绑本机：客户从 nginx 的 80 端口进来，不直连这个实例
      - "127.0.0.1:${AI_HELPDESK_CUSTOMER_PORT:-8081}:8000"
    env_file:
      - ./backend/.env
      - ./backend/.env.customer
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aihelpdesk123}@redis:6379/0
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-aihelpdesk}:${POSTGRES_PASSWORD:-aihelpdesk123}@postgres:5432/${POSTGRES_DB:-aihelpdesk}
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - AI_HELPDESK_SKILLS_DIR=/app/skills
      - LOG_FORMAT=json
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=ai-helpdesk-customer
      # 留空 = 不委派。必须写成 `KEY=`（带等号）：不带等号时 compose 会去取
      # 宿主机的同名变量。这里的空值会覆盖 env_file 里的值；镜像里没有 .env
      # （.dockerignore 排除了它），load_dotenv 也不覆盖已存在的变量。
      - SQL_AGENT_URL=
      # 关掉跨会话记忆，理由见这个服务开头的说明。
      - ENABLE_CROSS_SESSION_MEMORY=false
      # 工具循环只在员工实例上开（见 docs/evaluation/tool-loop-ab.md）。backend/.env
      # 两个实例共用，这里显式关掉，那边打开时客户实例不会跟着开。
      - AI_HELPDESK_TOOL_LOOP=off
      # 模型连接跟员工实例在控制台保存的那份走，这个实例自己不能改
      - AI_HELPDESK_MODEL_SETTINGS_PATH=/app/data/runtime/model_settings.json
      - AI_HELPDESK_MODEL_SETTINGS_EDITABLE=false
    volumes:
      - ./backend/data/eval:/app/data/eval
      - ./backend/skills:/app/skills
      - ./backend/logs/customer:/app/logs
      - ./backend/data/runtime:/app/data/runtime
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── 前端控制台（Vite 构建 + Nginx 托管）──────────────────────────────────────
  # 和后端放在同一个 compose 里，`docker compose up` 一条命令起全栈。
  # 前端容器内的 Nginx 把 /api/ 反代到 ai-helpdesk:8000，走 Docker 内网，
  # 因此不需要 host.docker.internal，也不受宿主机端口占用影响。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ai-helpdesk-frontend
    ports:
      # 只绑本机，理由同员工实例：控制台背后就是那个没有 API key 的实例。
      - "127.0.0.1:5174:80"
    environment:
      - API_UPSTREAM=ai-helpdesk:8000
    depends_on:
      ai-helpdesk:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Nginx 反向代理（对外入口，给客户）──────────────────────────────────────
  # 80 端口转发到面向客户的实例 ai-helpdesk-customer，不是员工实例。
  # 员工直连 8080，或者用控制台 5174。
  nginx:
    image: nginx:alpine
    container_name: ai-helpdesk-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      ai-helpdesk-customer:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── OTel Collector（trace 汇聚，转发 Tempo）─────────────────────────────────
  otel-collector:
    # 0.116.0 的镜像在部分主机上 exec 失败（exec /otelcol-contrib: no such file or
    # directory，镜像本身完好、重拉无效、直接 docker run 同样失败）。0.127.0 正常。
    image: otel/opentelemetry-collector-contrib:0.127.0
    container_name: ai-helpdesk-otel
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/otel/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4318:4318"   # OTLP HTTP（后端 SDK 上报；只绑本机）
    depends_on:
      - tempo
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

  # ── Grafana Tempo（trace 存储）──────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: ai-helpdesk-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./deploy/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

  # ── Loki（日志存储）─────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: ai-helpdesk-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

  # ── Promtail（采集容器 JSON 日志推给 Loki）──────────────────────────────────
  #
  # ⚠️ **Promtail 已于 2026-03-02 EOL，不再有安全更新。** 这一条还没换，
  # 原因写在这里免得被当成没人注意到：
  #
  # - Grafana 官方的替代是 **Alloy**（`grafana/alloy`），它不是同一套配置——
  #   `deploy/promtail/promtail.yml` 要重写成 Alloy 的 river 配置，
  #   `scrape_configs` 那套 relabel 规则得逐条翻译；
  # - 换完必须实跑验证"日志真的还在进 Loki"。**这类改动最典型的失败形态
  #   就是静默的**：容器起来了、面板还在、只是没有新日志进来，
  #   而没人会盯着一个"本来就不常看"的面板。
  #
  # 也就是说这是一次需要能跑起来整栈才能做的改动。当时这台机器
  # 拉不动 Docker Hub（3MB 的 alpine 三分钟都下不来），验证不了，所以**没动**。
  # 换的时候按上面两条走，别只改镜像名。
  promtail:
    image: grafana/promtail:3.3.2
    container_name: ai-helpdesk-promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./deploy/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

  # ── Grafana（统一面板：指标 + 日志 + trace 跳转）─────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-helpdesk-grafana
    ports:
      # 只绑本机：监控面板不该从主机外可达（docs/ops/pilot-readiness.md「收起对外端口」）
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-aihelpdesk123}
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  ai-helpdesk-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
  nginx-logs:
