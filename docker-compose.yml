# ai-helpdesk 智能客服系统 — Docker Compose 服务编排
#
# 存储：Redis（工作记忆/限流/熔断共享）+ Postgres+pgvector（工单/审计/
#       KB 向量/情景记忆/用户画像，存储收敛后的唯一持久化数据库）
# 观测：Prometheus（指标）+ OTel Collector → Tempo（trace）+
#       Promtail → Loki（日志）+ Grafana（统一面板，含 trace 跳转）

services:

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-helpdesk-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-aihelpdesk123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aihelpdesk123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Postgres + pgvector（存储收敛：工单/审计/KB 向量/记忆/画像）──────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-helpdesk-postgres
    ports:
      # 宿主机侧用 5433：5432 被另一个 compose 项目（askdata_agent 的 pgvector）占用。
      # app 走内网 postgres:5432，不受这里影响；这个映射只给本机 psql/GUI 用。
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aihelpdesk}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aihelpdesk123}
      - POSTGRES_DB=${POSTGRES_DB:-aihelpdesk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihelpdesk} -d ${POSTGRES_DB:-aihelpdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-helpdesk-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./backend/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/config/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── ai-helpdesk 主应用 ─────────────────────────────────────────────────────────
  ai-helpdesk:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai-helpdesk-app
    ports:
      # 宿主机 8080 → 容器 8000。容器内固定 8000（Dockerfile 的 CMD 写死），
      # 换宿主机端口只改冒号左边。8000 让给同机的 ai-sql-agent。
      - "${AI_HELPDESK_PORT:-8080}:8000"
    env_file:
      - ./backend/.env
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aihelpdesk123}@redis:6379/0
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-aihelpdesk}:${POSTGRES_PASSWORD:-aihelpdesk123}@postgres:5432/${POSTGRES_DB:-aihelpdesk}
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - AI_HELPDESK_SKILLS_DIR=/app/skills
      # 观测：JSON 日志给 Promtail/Loki，trace 发 OTel Collector
      - LOG_FORMAT=json
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./backend/data/eval:/app/data/eval
      - ./backend/skills:/app/skills
      - ./backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── 前端控制台（Vite 构建 + Nginx 托管）──────────────────────────────────────
  # 和后端放在同一个 compose 里，`docker compose up` 一条命令起全栈。
  # 前端容器内的 Nginx 把 /api/ 反代到 ai-helpdesk:8000，走 Docker 内网，
  # 因此不需要 host.docker.internal，也不受宿主机端口占用影响。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ai-helpdesk-frontend
    ports:
      - "5174:80"
    environment:
      - API_UPSTREAM=ai-helpdesk:8000
    depends_on:
      ai-helpdesk:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Nginx 反向代理 ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ai-helpdesk-nginx
    ports:
      - "80:80"
    volumes:
      - ./backend/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      ai-helpdesk:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── OTel Collector（trace 汇聚，转发 Tempo）─────────────────────────────────
  otel-collector:
    # 0.116.0 的镜像在部分主机上 exec 失败（exec /otelcol-contrib: no such file or
    # directory，镜像本身完好、重拉无效、直接 docker run 同样失败）。0.127.0 正常。
    image: otel/opentelemetry-collector-contrib:0.127.0
    container_name: ai-helpdesk-otel
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./backend/config/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4318:4318"   # OTLP HTTP（后端 SDK 上报）
    depends_on:
      - tempo
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

  # ── Grafana Tempo（trace 存储）──────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: ai-helpdesk-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./backend/config/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

  # ── Loki（日志存储）─────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: ai-helpdesk-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./backend/config/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

  # ── Promtail（采集容器 JSON 日志推给 Loki）──────────────────────────────────
  #
  # ⚠️ **Promtail 已于 2026-03-02 EOL，不再有安全更新。** 这一条还没换，
  # 原因写在这里免得被当成没人注意到：
  #
  # - Grafana 官方的替代是 **Alloy**（`grafana/alloy`），它不是同一套配置——
  #   `backend/config/promtail.yml` 要重写成 Alloy 的 river 配置，
  #   `scrape_configs` 那套 relabel 规则得逐条翻译；
  # - 换完必须实跑验证"日志真的还在进 Loki"。**这类改动最典型的失败形态
  #   就是静默的**：容器起来了、面板还在、只是没有新日志进来，
  #   而没人会盯着一个"本来就不常看"的面板。
  #
  # 也就是说这是一次需要能跑起来整栈才能做的改动。当时这台机器
  # 拉不动 Docker Hub（3MB 的 alpine 三分钟都下不来），验证不了，所以**没动**。
  # 换的时候按上面两条走，别只改镜像名。
  promtail:
    image: grafana/promtail:3.3.2
    container_name: ai-helpdesk-promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./backend/config/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

  # ── Grafana（统一面板：指标 + 日志 + trace 跳转）─────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-helpdesk-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-aihelpdesk123}
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./backend/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped
    networks:
      - ai-helpdesk-network

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  ai-helpdesk-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
  nginx-logs:
