<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" width="960" height="588" role="img" aria-labelledby="title desc">
  <title id="title">A2A Contract architecture</title>
  <desc id="desc">ai-helpdesk, the support agent, reads ai-sql-agent's Agent Card and calls POST /a2a with message/stream. While the SQL agent's loop calls the model and runs read-only SQL on four databases, it streams back over JSON-RPC 2.0 and SSE a task, a status update for each stage, one artifact with the data part and exactly one final event. The helpdesk's A2A client watches for 20 s of silence and a 90 s cap, judges the data part with assess() and streams progress and the answer to the console. The a2a-contract repository, version 1.13, defines every frame with the contract, five JSON Schemas, 30 golden fixtures and a self-check, and both repositories' CI pin its tag. Pulses travel each connection in that order.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #8e8e93; }
    .ctitle { font-size: 15px; font-weight: 600; fill: #1d1d1f; }
    .csub { font-size: 12px; fill: #8e8e93; }
    .title { font-size: 14px; font-weight: 600; fill: #1d1d1f; }
    .big { font-size: 15px; }
    .sub { font-size: 12px; fill: #6e6e73; }
    .edge { font-size: 11px; fill: #8e8e93; }
    .proto, .code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .proto { font-size: 11px; fill: #6e6e73; }
    .code { font-size: 12px; font-weight: 600; }
    .teal { fill: #0d9488; }
    .orange { fill: #c4623f; }
    .ver { font-size: 11px; font-weight: 600; fill: #6e56cf; }
    .pill { fill: #faf9fe; stroke: #e4defa; stroke-width: 1; }
    .pilltext { font-size: 11px; fill: #4a4a50; }
    .box { fill: #fafafb; stroke: #e3e3e8; stroke-width: 1; }
    .card { fill: #ffffff; stroke: #e3e3e8; stroke-width: 1; }
    .accent { fill: #fdfcff; stroke: #cfc4f5; stroke-width: 1.5; }
    .wire { fill: none; stroke: #d6d6dc; stroke-width: 1.5; }
    .head { fill: #c7c7cc; }
    .pulse {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 0.14 1.3;
      stroke-dashoffset: 0.14;
      opacity: 0;
      animation: travel 8s linear infinite;
    }
    .data { stroke: #0a7cff; }
    .ai { stroke: #d97757; }
    .event { stroke: #0d9488; }
    .contract { stroke: #6e56cf; }
    @keyframes travel {
      0% { stroke-dashoffset: 0.14; opacity: 1; }
      24% { stroke-dashoffset: -1; opacity: 1; }
      25%, 100% { stroke-dashoffset: -1; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>
