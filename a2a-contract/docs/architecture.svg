  <path class="pulse contract" pathLength="1" filter="url(#glow)" d="M160,468 V408" style="animation-delay: 6.6s" />
  <path class="pulse contract" pathLength="1" filter="url(#glow)" d="M540,468 C540,438 680,438 680,408" style="animation-delay: 6.6s" />
