  <text class="proto" x="502" y="106" text-anchor="middle">GET /.well-known/agent.json</text>
  <text class="proto" x="480" y="217" text-anchor="middle">POST /a2a · message/stream</text>
  <text class="proto" x="480" y="251" text-anchor="middle">task · submitted</text>
  <text class="proto" x="480" y="285" text-anchor="middle">status-update × N · stage, step, database</text>
  <text class="proto" x="480" y="319" text-anchor="middle">artifact-update · data part</text>
  <text class="proto" x="480" y="353" text-anchor="middle">status-update · final: true · completed</text>
  <text class="edge" x="92" y="176" text-anchor="end">question</text>
  <text class="edge" x="212" y="176" text-anchor="end">progress · answer</text>
  <text class="edge" x="708" y="440">model calls</text>
  <text class="edge" x="858" y="440">read-only SQL</text>
  <text class="edge" x="408" y="428">defines every frame on this wire</text>
  <text class="edge" x="168" y="444">CI pins v1.13 · pytest</text>
  <text class="edge" x="530" y="452" text-anchor="end">CI pins v1.13 · unittest</text>
  <!-- Pulses: one delegated question, in order -->
