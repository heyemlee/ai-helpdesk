  <path class="pulse ai" pathLength="1" filter="url(#glow)" d="M700,392 V468" style="animation-delay: 3.6s" />
  <path class="pulse event" pathLength="1" filter="url(#glow)" d="M676,292 H284" style="animation-delay: 4.0s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M676,326 H284" style="animation-delay: 4.6s" />
  <path class="pulse event" pathLength="1" filter="url(#glow)" d="M676,360 H284" style="animation-delay: 5.2s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M220,200 V144" style="animation-delay: 5.8s" />
