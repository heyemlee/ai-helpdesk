name: contract

# 契约仓库只有文档和 schema，没有产品代码，所以 CI 只做机器能做的那几件事：
#   1. schema 自己是合法的 JSON Schema，且契约点名的枚举真的在 schema 里；
#   2. fixtures 的实际校验结果与清单声明一致——**反例必须真的被拒**；
#   3. 文档里的 §小节引用和文件路径都指向真实存在的东西；
#   4. 每一处「当前钉哪一版」的写法都与契约状态行一致。
#
# 为什么值得有：前四版的问题全都是"文档说的和现实不符"，而这四件事恰好是
# 其中能被机器逮住的那部分（见契约附录 B 自检表第 5 条）。
#
# **四件事全在 tools/check_contract.py 里，这里不再写第二份断言。**
# v1.10 之前第 4 条有一段写在本文件里的 bash（只比"状态行 vs 附录 A"两处），
# 而漂掉的是它没覆盖的第三处、第四处——CONSUMER-TESTS.md 的「配套：（v1.5）」
# 和 `--branch v1.9`，各自活过了五个和两个版本。
# 判据分散在两个地方，就等于没有一个地方知道判据的全集。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: schema + fixtures + links + version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本段会看 tag 在不在。浅克隆默认不带 tag，取不到就跳过那一行提示
          # （不影响判定），但带上更有信息量。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --upgrade pip jsonschema referencing

      - name: 契约自检
        run: python3 tools/check_contract.py
